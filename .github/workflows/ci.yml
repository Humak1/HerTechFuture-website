# Continuous integration.
#
# Runs on every push and every pull request. If typecheck, lint or build fails,
# GitHub marks the commit with a red cross -- so a mistake is caught in about a
# minute rather than after it is live.
#
# This is also the file that makes the repository look like a real project
# rather than a coursework folder.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run if you push again while one is still going. Saves time
# and keeps the Actions minutes down.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest

    # Least privilege: this job only needs to read the repository. Never grant
    # write access to a workflow that does not need it.
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` installs exactly what package-lock.json specifies, and fails if
      # the lockfile is out of step with package.json. `npm install` would
      # quietly resolve new versions -- which is precisely what you do not want
      # in an automated build.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Fails the build if any dependency has a known high-severity
      # vulnerability. Start at `high` -- setting it to `low` on a fresh
      # Next.js project produces noise you will learn to ignore, which defeats
      # the point.
      - name: Audit dependencies
        run: npm audit --audit-level=high
